<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Diff Detector</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', 'Helvetica Neue', sans-serif;
    background: #0d0d0f;
    color: #e8e6e0;
    min-height: 100vh;
    padding: 2rem;
  }

  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2.5rem;
    border-bottom: 0.5px solid #2a2a2e;
    padding-bottom: 1.25rem;
  }

  header h1 {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: #e8e6e0;
  }

  header span {
    font-size: 12px;
    color: #555;
    font-family: 'DM Mono', monospace;
  }

  .api-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 2rem;
    align-items: center;
  }

  .api-bar input {
    flex: 1;
    background: #1a1a1e;
    border: 0.5px solid #2a2a2e;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    color: #e8e6e0;
    outline: none;
    transition: border-color 0.15s;
  }

  .api-bar input:focus { border-color: #444; }
  .api-bar label { font-size: 12px; color: #555; white-space: nowrap; }

  .upload-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .drop-zone {
    background: #1a1a1e;
    border: 0.5px solid #2a2a2e;
    border-radius: 8px;
    aspect-ratio: 4/3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .drop-zone:hover { border-color: #444; background: #1e1e22; }
  .drop-zone.has-image { border-color: #333; }

  .drop-zone img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }

  .drop-zone .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.15s;
    border-radius: 8px;
  }

  .drop-zone:hover .overlay { opacity: 1; }

  .drop-zone .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .drop-zone .icon {
    width: 32px;
    height: 32px;
    border: 0.5px solid #333;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .drop-zone .label {
    font-size: 12px;
    color: #555;
    text-align: center;
  }

  .drop-zone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .tag {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.7);
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: #888;
    padding: 3px 7px;
    border-radius: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    z-index: 2;
  }

  .prompt-area {
    margin-bottom: 16px;
  }

  .prompt-area label {
    font-size: 11px;
    color: #555;
    font-family: 'DM Mono', monospace;
    display: block;
    margin-bottom: 6px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .prompt-area textarea {
    width: 100%;
    background: #1a1a1e;
    border: 0.5px solid #2a2a2e;
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13px;
    color: #e8e6e0;
    font-family: 'DM Sans', sans-serif;
    resize: vertical;
    min-height: 80px;
    outline: none;
    line-height: 1.6;
    transition: border-color 0.15s;
  }

  .prompt-area textarea:focus { border-color: #444; }

  .run-btn {
    width: 100%;
    padding: 11px;
    background: #e8e6e0;
    color: #0d0d0f;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    font-family: 'DM Sans', sans-serif;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
  }

  .run-btn:hover { background: #fff; }
  .run-btn:active { transform: scale(0.99); }
  .run-btn:disabled { background: #2a2a2e; color: #555; cursor: not-allowed; transform: none; }

  .status {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: #555;
    margin-bottom: 16px;
    min-height: 18px;
  }

  .status.running { color: #888; }
  .status.done { color: #5a9e6f; }
  .status.error { color: #c05050; }

  .results {
    display: none;
    gap: 12px;
  }

  .results.visible {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .result-panel {
    background: #1a1a1e;
    border: 0.5px solid #2a2a2e;
    border-radius: 8px;
    overflow: hidden;
  }

  .result-panel .panel-header {
    padding: 10px 14px;
    border-bottom: 0.5px solid #2a2a2e;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: #555;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .result-panel canvas {
    display: block;
    width: 100%;
  }

  .json-panel {
    padding: 14px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #888;
    white-space: pre;
    overflow-x: auto;
  }

  .json-panel .key { color: #6699cc; }
  .json-panel .num { color: #f0b060; }
  .json-panel .str { color: #7ec88c; }

  .copy-btn {
    background: transparent;
    border: 0.5px solid #333;
    border-radius: 4px;
    color: #555;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    padding: 2px 8px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .copy-btn:hover { border-color: #555; color: #888; }

  .description-panel {
    grid-column: 1 / -1;
    background: #1a1a1e;
    border: 0.5px solid #2a2a2e;
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    color: #aaa;
    line-height: 1.7;
  }

  .description-panel strong {
    color: #e8e6e0;
    font-weight: 500;
  }

  @media (max-width: 640px) {
    .upload-grid, .results.visible { grid-template-columns: 1fr; }
    .description-panel { grid-column: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>Visual Diff Detector</h1>
  <span>powered by claude</span>
</header>

<div class="api-bar">
  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" />
</div>

<div class="upload-grid">
  <div class="drop-zone" id="zone1">
    <span class="tag">before</span>
    <div class="placeholder" id="ph1">
      <div class="icon">+</div>
      <div class="label">Upload image 1</div>
    </div>
    <div class="overlay"><div class="label" style="color:#ccc">Replace image</div></div>
    <input type="file" accept="image/*" onchange="handleUpload(1, this)" />
  </div>
  <div class="drop-zone" id="zone2">
    <span class="tag">after</span>
    <div class="placeholder" id="ph2">
      <div class="icon">+</div>
      <div class="label">Upload image 2</div>
    </div>
    <div class="overlay"><div class="label" style="color:#ccc">Replace image</div></div>
    <input type="file" accept="image/*" onchange="handleUpload(2, this)" />
  </div>
</div>

<div class="prompt-area">
  <label>Detection prompt</label>
  <textarea id="prompt">You are an expert visual inspection AI. Compare these two images carefully and identify any notable differences, anomalies, stains, damage, or changes between them.

Return ONLY a JSON object with this exact structure — no markdown, no explanation:
{
  "description": "brief description of the difference found",
  "bounding_box": {
    "x": <left edge in pixels>,
    "y": <top edge in pixels>,
    "width": <width in pixels>,
    "height": <height in pixels>
  }
}

The bounding box must tightly surround the area of difference in the second (after) image, using the full original image resolution.</textarea>
</div>

<button class="run-btn" id="runBtn" onclick="runDetection()" disabled>Detect differences</button>

<div class="status" id="status"></div>

<div class="results" id="results">
  <div class="result-panel">
    <div class="panel-header">annotated result</div>
    <canvas id="resultCanvas"></canvas>
  </div>
  <div class="result-panel">
    <div class="panel-header">
      <span>bounding box json</span>
      <button class="copy-btn" onclick="copyJSON()">copy</button>
    </div>
    <div class="json-panel" id="jsonPanel"></div>
  </div>
  <div class="description-panel" id="descPanel"></div>
</div>

<script>
const state = { img1: null, img2: null, img1Data: null, img2Data: null, lastJSON: null };

function handleUpload(n, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const dataURL = e.target.result;
    const base64 = dataURL.split(',')[1];
    const mime = dataURL.split(';')[0].split(':')[1];
    if (n === 1) {
      state.img1 = { base64, mime };
      showPreview('zone1', 'ph1', dataURL);
    } else {
      state.img2 = { base64, mime };
      showPreview('zone2', 'ph2', dataURL);
    }
    updateBtn();
  };
  reader.readAsDataURL(file);
}

function showPreview(zoneId, phId, dataURL) {
  const zone = document.getElementById(zoneId);
  zone.classList.add('has-image');
  let img = zone.querySelector('img.preview');
  if (!img) {
    img = document.createElement('img');
    img.className = 'preview';
    zone.insertBefore(img, zone.firstChild);
  }
  img.src = dataURL;
  document.getElementById(phId).style.display = 'none';
}

function updateBtn() {
  const btn = document.getElementById('runBtn');
  btn.disabled = !(state.img1 && state.img2 && document.getElementById('apiKey').value.trim());
}

document.getElementById('apiKey').addEventListener('input', updateBtn);

async function runDetection() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const prompt = document.getElementById('prompt').value.trim();
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');

  btn.disabled = true;
  setStatus('running', 'Sending images to Claude...');
  document.getElementById('results').classList.remove('visible');

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1024,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: state.img1.mime, data: state.img1.base64 } },
            { type: 'image', source: { type: 'base64', media_type: state.img2.mime, data: state.img2.base64 } },
            { type: 'text', text: prompt }
          ]
        }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const text = data.content.map(b => b.text || '').join('').trim();

    let parsed;
    try {
      const clean = text.replace(/```json|```/g, '').trim();
      parsed = JSON.parse(clean);
    } catch {
      throw new Error('Claude returned unexpected format: ' + text.slice(0, 120));
    }

    state.lastJSON = parsed;
    setStatus('done', 'Detection complete');
    await renderResult(parsed);

  } catch (err) {
    setStatus('error', 'Error: ' + err.message);
  } finally {
    btn.disabled = false;
  }
}

function setStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

async function renderResult(parsed) {
  const bb = parsed.bounding_box;
  const canvas = document.getElementById('resultCanvas');
  const ctx = canvas.getContext('2d');

  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    ctx.strokeStyle = '#ff3b30';
    ctx.lineWidth = Math.max(4, img.width / 400);
    ctx.strokeRect(bb.x, bb.y, bb.width, bb.height);

    const pad = ctx.lineWidth * 2;
    ctx.fillStyle = 'rgba(255, 59, 48, 0.12)';
    ctx.fillRect(bb.x + pad, bb.y + pad, bb.width - pad * 2, bb.height - pad * 2);

    const labelH = Math.max(28, img.width / 80);
    const fontSize = Math.max(12, img.width / 200);
    ctx.fillStyle = '#ff3b30';
    ctx.fillRect(bb.x, bb.y - labelH, 110, labelH);
    ctx.fillStyle = '#fff';
    ctx.font = `${fontSize}px DM Mono, monospace`;
    ctx.fillText('anomaly detected', bb.x + 6, bb.y - labelH / 3);

    renderJSON(parsed);

    const desc = document.getElementById('descPanel');
    desc.innerHTML = `<strong>Finding:</strong> ${parsed.description || 'See bounding box for detected anomaly.'}`;
    document.getElementById('results').classList.add('visible');
  };

  img.src = 'data:' + state.img2.mime + ';base64,' + state.img2.base64;
}

function renderJSON(parsed) {
  const bb = parsed.bounding_box;
  const panel = document.getElementById('jsonPanel');
  panel.innerHTML =
    `<span class="key">"bounding_box"</span>: {\n` +
    `  <span class="key">"x"</span>: <span class="num">${bb.x}</span>,\n` +
    `  <span class="key">"y"</span>: <span class="num">${bb.y}</span>,\n` +
    `  <span class="key">"width"</span>: <span class="num">${bb.width}</span>,\n` +
    `  <span class="key">"height"</span>: <span class="num">${bb.height}</span>\n` +
    `}`;
}

function copyJSON() {
  if (!state.lastJSON) return;
  const text = JSON.stringify({ bounding_box: state.lastJSON.bounding_box }, null, 2);
  navigator.clipboard.writeText(text);
  const btn = document.querySelector('.copy-btn');
  btn.textContent = 'copied!';
  setTimeout(() => btn.textContent = 'copy', 1500);
}
</script>
</body>
</html>
